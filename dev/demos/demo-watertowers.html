<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>水塔样式 Demo</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #e8eef2; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #hint {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    font: 13px/1.6 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    color: #3a4048; background: rgba(255,255,255,.88);
    padding: 9px 20px; border-radius: 999px;
    box-shadow: 0 2px 14px rgba(0,0,0,.10);
    pointer-events: none; white-space: nowrap;
  }
  #title {
    position: fixed; left: 24px; top: 20px;
    font: 600 15px/1.4 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    color: #2a3038; pointer-events: none;
  }
  #title span { display: block; font-weight: 400; font-size: 12px; color: #7a8088; margin-top: 3px; }
  .labels {
    position: fixed; left: 0; right: 0; bottom: 74px;
    display: flex; justify-content: center; gap: 0;
    font: 12px/1 system-ui, sans-serif; color: #4a5058;
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title">水塔样式 Demo<span>拖动旋转 · 滚轮缩放</span></div>
<div id="hint">左：A 金属水塔　中：B 木桶水塔　右：C 深木绿瓦水塔</div>
<script type="module" src="./src/demo-watertowers.js"></script>

</html>
