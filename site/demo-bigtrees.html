<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>参天大树 Demo</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #e8eef2; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #hint {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    font: 13px/1.6 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    color: #3a4048; background: rgba(255,255,255,.88);
    padding: 9px 20px; border-radius: 999px;
    box-shadow: 0 2px 14px rgba(0,0,0,.10);
    pointer-events: none; white-space: nowrap;
  }
  #title {
    position: fixed; left: 24px; top: 20px;
    font: 600 15px/1.4 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    color: #2a3038; pointer-events: none;
  }
  #title span { display: block; font-weight: 400; font-size: 12px; color: #7a8088; margin-top: 3px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title">参天大树 Demo<span>拖动旋转 · 滚轮缩放 · 9 种体素巨树</span></div>
<div id="hint">1 分层常青　2 阔叶　3 凤凰木　4 仙人掌　5 紫叶　6 秋树　7 黄叶　8 粉花　9 绿金</div>
<script type="module" src="./src/demo-bigtrees.js"></script>
</body>
</html>
